<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e50920">
<meta name="description" content="Pede a tua música ao DJ.">
<title>DJ Requests</title>
<link rel="icon" href="/assets/fep-class-1996.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --red:#e50920;
  --red-hover:#c80619;
  --red-deep:#8d001d;
  --ink:#1f0c0f;
  --muted:#6f5358;
  --placeholder:#8a6d71;
  --line:#f0d2d6;
  --soft:#fff6f7;
  --chip:#f3eded;
  --ok:#11703a;
  --ok-bg:#e8f7ec;
  --err:#b0102a;
  --err-bg:#fdecee;
  --warn-bg:#fff4da;
  --radius:16px;
  --shadow:0 18px 40px rgba(94,0,19,.28);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#c4061b}
body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(180deg,#f2142e 0%,var(--red) 42%,#c4061b 100%) fixed;
  color:var(--ink);
  font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.wrap{max-width:560px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px max(56px,env(safe-area-inset-bottom))}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:#fff;color:var(--red-deep);padding:8px 12px;border-radius:10px;font-weight:700;z-index:30;text-decoration:none}
.skip:focus{top:12px}
.hidden{display:none!important}

/* Cabeçalho */
.brand{text-align:center;color:#fff;padding:14px 0 26px}
.cover{display:block;width:min(62vw,216px);height:auto;aspect-ratio:1/1;margin:0 auto 20px;border-radius:20px;box-shadow:0 16px 36px rgba(94,0,19,.38)}
.brand h1{margin:0;font-size:14px;font-weight:800;letter-spacing:.24em;text-transform:uppercase}
.tagline{margin:6px 0 0;font-size:15px;color:rgba(255,255,255,.92)}
body.is-admin .cover{display:none}
body.is-admin .brand{padding:6px 0 18px}

/* Campos e botões */
.stack{display:grid;gap:10px}
.input{
  width:100%;height:52px;background:#fff;color:var(--ink);
  border:2px solid transparent;border-radius:14px;padding:0 16px;
  font:inherit;outline:none;box-shadow:0 2px 0 rgba(94,0,19,.18);
  transition:border-color .15s,box-shadow .15s;
  appearance:none;-webkit-appearance:none;
}
.input::placeholder{color:var(--placeholder);opacity:1}
.input:focus{border-color:var(--red-deep);box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.input.compact{height:46px;font-size:15px;background:rgba(255,255,255,.96)}
.search{position:relative}
.search .input{padding-left:48px;font-size:17px}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--placeholder);pointer-events:none}

.btn{
  appearance:none;border:0;border-radius:999px;min-height:44px;padding:10px 18px;
  font:inherit;font-weight:700;font-size:15px;line-height:1;white-space:nowrap;cursor:pointer;
  transition:background .15s,transform .12s,opacity .15s,color .15s;
}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:wait}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 6px 14px rgba(229,9,32,.32)}
.btn-primary:hover:not(:disabled){background:var(--red-hover)}
.btn-ghost{background:#fff;color:var(--red-deep);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-ghost:hover:not(:disabled){background:var(--soft)}
.btn-danger{background:transparent;color:var(--err);box-shadow:inset 0 0 0 1.5px #f1bfc6}
.btn-danger:hover:not(:disabled){background:var(--err-bg)}
.btn-block{width:100%}
.btn-done{background:var(--ok-bg);color:var(--ok);box-shadow:none;cursor:default}
.icon-btn{
  appearance:none;border:0;width:44px;height:44px;border-radius:12px;background:#fff;color:var(--red-deep);
  box-shadow:inset 0 0 0 1.5px var(--line);font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;
}
.icon-btn:hover{background:var(--soft)}
.link{background:none;border:0;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:10px 8px;text-decoration:underline;text-underline-offset:3px}
.link-dark{background:none;border:0;color:var(--red-deep);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:10px 8px;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
.sheet button:focus-visible,.sheet a:focus-visible,.results button:focus-visible{outline-color:var(--red-deep)}

/* Pesquisa pública */
.hint{margin:14px 4px 12px;font-size:14px;color:#fff;min-height:1.5em}
.results{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.track{
  display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--radius);
  padding:14px 14px 14px 18px;box-shadow:0 8px 20px rgba(94,0,19,.18);
  animation:rise .22s ease both;
}
.track-info{flex:1;min-width:0}
.track-name{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.track-artist{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.toasts{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,460px);display:grid;gap:8px;z-index:20;pointer-events:none}
.toast{
  background:#fff;color:var(--ink);border-radius:14px;padding:13px 16px;font-size:14px;line-height:1.4;
  box-shadow:0 14px 34px rgba(60,0,12,.35);border-left:5px solid var(--ok);animation:rise .2s ease both;
}
.toast.error{border-left-color:var(--err)}
.foot{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;margin-top:26px}
.empty-state{padding:28px 10px;text-align:center;color:#fff;font-size:15px}

/* Painel DJ */
.sheet{background:#fff;color:var(--ink);border-radius:22px;padding:22px 18px 16px;box-shadow:var(--shadow)}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet-head h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.count{margin:3px 0 0;color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:8px;align-items:center}
.spotify{border-radius:12px;padding:11px 14px;background:var(--soft);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin-bottom:14px}
.spotify.ok{background:var(--ok-bg)}
.spotify.bad{background:var(--warn-bg)}
.spotify a{color:var(--red-deep);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#fbe6e9;padding:4px;border-radius:14px;margin-bottom:6px}
.seg button{appearance:none;border:0;background:transparent;border-radius:10px;min-height:40px;padding:8px 6px;font:inherit;font-size:14px;font-weight:700;color:var(--red-deep);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(94,0,19,.16)}
.seg.two{grid-template-columns:1fr 1fr;margin-bottom:12px}
.list{list-style:none;margin:0;padding:0}
.count-badge{
  flex-shrink:0;width:58px;height:58px;border-radius:50%;background:var(--red);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 4px #ffe1e5,0 6px 14px rgba(229,9,32,.35);
}
.count-badge small{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.request{display:flex;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.request:first-child{border-top:0}
.request-main{display:flex;align-items:center;gap:14px;flex:1;min-width:0}
.request-info{flex:1;min-width:0}
.request-title{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.request-sub{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);color:#4d3438;line-height:1.4}
.chip.pending{background:#fde3e6;color:var(--red-deep)}
.chip.played{background:var(--chip);color:#4d3438}
.chip.synced{background:var(--ok-bg);color:var(--ok)}
.chip.syncing{background:var(--chip);color:#5a4a4d}
.chip.failed{background:var(--err-bg);color:var(--err)}
.who{margin-top:6px;font-size:14px;color:var(--ink);line-height:1.5}
.who .sep{color:var(--muted);margin:0 6px}
.who .when{color:var(--muted);font-size:13px}
.err-hint{margin-top:7px;font-size:13px;color:var(--err);line-height:1.4}
.request-actions{display:flex;flex-direction:column;gap:8px;flex-shrink:0;width:112px}
.request-actions .btn{width:100%;min-height:40px;padding:8px 12px;font-size:14px}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.sheet-foot{display:flex;justify-content:flex-end;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}

/* Login */
.login{max-width:380px;margin:9vh auto 0}
.login .sheet{padding:26px 22px 14px}
.login h2{margin:0;font-size:24px;font-weight:800}
.login-foot{display:flex;justify-content:center;margin-top:8px}
.login .sub{margin:4px 0 18px;color:var(--muted);font-size:14px}
.form-error{min-height:0;margin:10px 0 0;font-size:14px;color:var(--err)}
.form-error:empty{display:none}

@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:440px){
  .request{flex-wrap:wrap}
  .request-main{flex-basis:100%}
  .request-actions{flex-direction:row;width:100%}
  .request-actions .btn{flex:1}
  .request-actions .btn:only-child{flex:0 0 auto;min-width:128px}
  .toolbar .btn-ghost{padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>

<body>
<a class="skip" href="#main">Saltar para o conteúdo</a>
<main class="wrap" id="main">

  <header class="brand">
    <img class="cover" src="/assets/fep-class-1996.png" alt="FEP, Class of 1996" width="640" height="640">
    <h1>DJ Requests</h1>
    <p class="tagline">Escolhe a música. Nós tratamos do resto.</p>
  </header>

  <section id="guest" aria-label="Pedir música">
    <div class="stack">
      <div>
        <label class="sr" for="name">O teu nome</label>
        <input id="name" class="input compact" maxlength="80" placeholder="O teu nome (opcional)" autocomplete="name">
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <label class="sr" for="search">Pesquisar música ou artista</label>
        <input id="search" class="input" type="search" placeholder="Pesquisar música ou artista…" autocomplete="off" spellcheck="false" enterkeyhint="search">
      </div>
    </div>
    <p id="hint" class="hint" aria-live="polite">Escreve pelo menos 2 caracteres para pesquisar.</p>
    <ul id="results" class="results"></ul>
    <div class="foot">
      <button class="link" id="open-login" type="button">Painel DJ</button>
    </div>
  </section>

  <section id="login" class="hidden" aria-label="Entrar no painel DJ">
    <div class="login">
      <div class="sheet">
        <h2>Painel DJ</h2>
        <p class="sub">Acesso reservado ao DJ.</p>
        <form id="login-form" class="stack">
          <label class="sr" for="password">Palavra-passe</label>
          <input id="password" class="input" type="password" placeholder="Palavra-passe" autocomplete="current-password" required>
          <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        </form>
        <p id="login-error" class="form-error" role="alert"></p>
        <div class="login-foot">
          <button class="link-dark" id="back-guest" type="button">Voltar</button>
        </div>
      </div>
    </div>
  </section>

  <section id="admin" class="hidden" aria-label="Pedidos">
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <h2>Pedidos</h2>
          <p class="count" id="count" aria-live="polite">A carregar…</p>
        </div>
        <div class="toolbar">
          <button class="btn btn-ghost" id="sync" type="button">Sincronizar</button>
          <button class="icon-btn" id="refresh" type="button" aria-label="Atualizar lista" title="Atualizar lista">↻</button>
        </div>
      </div>

      <div id="spotify-status" class="spotify" role="status">A verificar Spotify…</div>

      <div class="seg" id="filters" role="group" aria-label="Filtrar pedidos">
        <button type="button" data-filter="all" aria-pressed="true">Todos</button>
        <button type="button" data-filter="pending" aria-pressed="false">Por tocar</button>
        <button type="button" data-filter="played" aria-pressed="false">Tocados</button>
      </div>

      <div class="seg two" id="sort" role="group" aria-label="Ordenar pedidos">
        <button type="button" data-sort="recent" aria-pressed="true">Mais recentes</button>
        <button type="button" data-sort="popular" aria-pressed="false">Mais pedidas</button>
      </div>

      <div id="requests"></div>

      <div class="sheet-foot">
        <button class="btn btn-danger" id="clear" type="button">Limpar pedidos</button>
      </div>
    </div>
    <div class="foot">
      <button class="link" id="to-guest" type="button">Vista pública</button>
      <button class="link" id="logout" type="button">Terminar sessão</button>
    </div>
  </section>

</main>

<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const NAME_KEY = 'dj-requests:name';
  const POLL_MS = 4000;
  const SYNC_LABELS = {
    synced: { cls: 'synced', label: 'Na playlist' },
    failed: { cls: 'failed', label: 'Erro na playlist' },
    syncing: { cls: 'syncing', label: 'A sincronizar' },
    pending: { cls: 'syncing', label: 'A sincronizar' }
  };
  const SYNC_ERRORS = {
    spotify_forbidden: 'Sem permissão na playlist. Confirma que a playlist pertence à conta DJ.',
    spotify_unauthorized: 'A ligação ao Spotify expirou. Volta a autorizar o Spotify.',
    spotify_token_refresh_failed: 'Não foi possível renovar a ligação ao Spotify. Volta a autorizar.',
    spotify_not_connected: 'O Spotify ainda não está autorizado.',
    spotify_rate_limited: 'Limite de pedidos do Spotify atingido. Tenta de novo daqui a pouco.',
    spotify_bad_request: 'O Spotify recusou o pedido. Confirma o ID da playlist.',
    spotify_not_found: 'Playlist não encontrada. Confirma o ID da playlist.'
  };

  const state = {
    filter: 'all',
    sort: 'recent',
    requests: [],
    snapshot: '',
    results: [],
    busy: false,
    searchTimer: null,
    searchSeq: 0,
    pollId: null
  };
  // Chave de idempotência por faixa: mantém-se entre tentativas falhadas, para que um reenvio não duplique o pedido.
  const idempotencyKeys = new Map();

  /* ---------- utilitários ---------- */
  function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function api(url, opts = {}) {
    const headers = { ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) };
    const r = await fetch(url, { credentials: 'same-origin', ...opts, headers });
    let data = {};
    try { data = await r.json(); } catch { /* resposta sem JSON */ }
    if (!r.ok) {
      const e = new Error(data.error || `http_${r.status}`);
      e.status = r.status;
      e.code = data.error;
      throw e;
    }
    return data;
  }

  function toast(message, kind = 'ok') {
    const el = document.createElement('div');
    el.className = 'toast' + (kind === 'error' ? ' error' : '');
    el.textContent = message;
    $('toasts').replaceChildren(el);
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.remove(), 5000);
  }

  function loadName() {
    try { return localStorage.getItem(NAME_KEY) || ''; } catch { return ''; }
  }
  function saveName(value) {
    try { value ? localStorage.setItem(NAME_KEY, value) : localStorage.removeItem(NAME_KEY); } catch { /* armazenamento indisponível */ }
  }
  function requesterName() {
    return $('name').value.trim() || 'Anónimo';
  }

  /* ---------- vistas ---------- */
  function show(view) {
    ['guest', 'login', 'admin'].forEach(v => $(v).classList.toggle('hidden', v !== view));
    document.body.classList.toggle('is-admin', view === 'admin');
    stopPolling();
    if (view === 'admin') {
      loadRequests();
      spotifyStatus();
      startPolling();
    }
    if (view === 'login') setTimeout(() => $('password').focus(), 0);
    if (view === 'guest') history.replaceState(null, '', '/');
  }

  function startPolling() {
    stopPolling();
    state.pollId = setInterval(() => { if (!document.hidden) loadRequests(); }, POLL_MS);
  }
  function stopPolling() {
    clearInterval(state.pollId);
    state.pollId = null;
  }

  /* ---------- pesquisa pública ---------- */
  function setHint(text) { $('hint').textContent = text; }

  function resetSearch() {
    state.searchSeq++;
    $('search').value = '';
    $('results').replaceChildren();
    state.results = [];
    setHint('Escreve para pedir outra música.');
  }

  $('search').addEventListener('input', () => {
    clearTimeout(state.searchTimer);
    const q = $('search').value.trim();
    $('results').replaceChildren();
    state.results = [];
    if (q.length < 2) { state.searchSeq++; setHint('Escreve pelo menos 2 caracteres para pesquisar.'); return; }
    setHint('A pesquisar…');
    state.searchTimer = setTimeout(() => search(q), 350);
  });

  async function search(q) {
    const seq = ++state.searchSeq;
    try {
      const list = await api('/api/spotify?q=' + encodeURIComponent(q));
      if (seq !== state.searchSeq) return;
      state.results = list;
      setHint(list.length ? 'Escolhe uma música para enviar o pedido.' : 'Não foram encontradas músicas. Experimenta outro termo.');
      renderResults();
    } catch (e) {
      if (seq !== state.searchSeq) return;
      setHint(e.code === 'spotify_search_not_configured'
        ? 'A pesquisa ainda não está configurada.'
        : 'Erro na pesquisa. Tenta novamente.');
    }
  }

  function renderResults() {
    $('results').innerHTML = state.results.map((t, i) => `
      <li class="track">
        <div class="track-info">
          <div class="track-name">${esc(t.name)}</div>
          <div class="track-artist">${esc(t.artist)}</div>
        </div>
        <button class="btn btn-primary" type="button" data-request="${i}" aria-label="Pedir ${esc(t.name)}">Pedir</button>
      </li>`).join('');
  }

  $('results').addEventListener('click', e => {
    const btn = e.target.closest('[data-request]');
    if (!btn) return;
    const track = state.results[Number(btn.dataset.request)];
    if (track) requestTrack(track, btn);
  });

  async function requestTrack(track, button) {
    if (state.busy) return;
    state.busy = true;
    button.disabled = true;
    const label = button.textContent;
    button.textContent = 'A enviar…';

    const key = idempotencyKeys.get(track.id) || crypto.randomUUID();
    idempotencyKeys.set(track.id, key);
    try {
      const r = await api('/api/requests', {
        method: 'POST',
        headers: { 'Idempotency-Key': key },
        body: JSON.stringify({ track, requester: requesterName() })
      });
      idempotencyKeys.delete(track.id);
      const sincronizada = r.spotify_sync_status === 'synced';
      toast(`Pedido enviado: ${track.name}` + (sincronizada
        ? '. Já está na playlist.'
        : '. Recebido. A sincronização será repetida pelo DJ.'));
      resetSearch();
    } catch {
      button.disabled = false;
      button.textContent = label;
      toast('Não foi possível enviar o pedido. Tenta novamente.', 'error');
    } finally {
      state.busy = false;
    }
  }

  $('name').value = loadName();
  $('name').addEventListener('change', () => saveName($('name').value.trim()));

  /* ---------- painel DJ ---------- */
  async function loadRequests() {
    try {
      const list = await api('/api/requests');
      state.requests = list;
      $('count').textContent = `${groupByTrack(list).filter(g => g.pending).length} por tocar · ${list.length} pedidos`;
      $('clear').disabled = list.length === 0;
      const snapshot = JSON.stringify(list);
      if (snapshot !== state.snapshot) {
        state.snapshot = snapshot;
        renderRequests();
      }
    } catch {
      $('count').textContent = 'Erro ao carregar pedidos.';
    }
  }

  // Data de criação em milissegundos (tolera frações de segundo com mais de 3 dígitos).
  function ts(r) {
    const t = Date.parse(String(r.created_at || '').replace(/(\.\d{3})\d+/, '$1'));
    return Number.isNaN(t) ? 0 : t;
  }

  // Uma entrada por música, com todos os pedidos dessa música.
  function groupByTrack(list) {
    const groups = new Map();
    for (const r of list) {
      const id = r.track?.id;
      if (!groups.has(id)) groups.set(id, { id, track: r.track, requests: [], latest: 0 });
      const g = groups.get(id);
      g.requests.push(r);
      g.latest = Math.max(g.latest, ts(r));
    }
    for (const g of groups.values()) {
      g.requests.sort((a, b) => ts(b) - ts(a));
      g.pending = g.requests.some(r => !r.played);
    }
    return [...groups.values()];
  }

  function renderRequests() {
    let groups = groupByTrack(state.requests);
    if (state.filter === 'pending') groups = groups.filter(g => g.pending);
    if (state.filter === 'played') groups = groups.filter(g => !g.pending);
    groups.sort(state.sort === 'popular'
      ? (a, b) => (b.requests.length - a.requests.length) || (b.latest - a.latest)
      : (a, b) => b.latest - a.latest);

    if (!groups.length) {
      $('requests').innerHTML = `<div class="empty">${emptyText()}</div>`;
      return;
    }
    $('requests').innerHTML = `<ul class="list">${groups.map(groupRow).join('')}</ul>`;
  }

  function emptyText() {
    if (state.filter === 'played') return 'Ainda não há músicas tocadas.';
    if (state.filter === 'pending') return 'Não há pedidos por tocar.';
    return 'Ainda não há pedidos.';
  }

  function groupRow(g) {
    const n = g.requests.length;
    const failed = g.requests.find(r => r.spotify_sync_status === 'failed');
    const busy = g.requests.some(r => r.spotify_sync_status === 'pending' || r.spotify_sync_status === 'syncing');
    const sync = failed ? SYNC_LABELS.failed : busy ? SYNC_LABELS.syncing : SYNC_LABELS.synced;
    const hint = failed
      ? `<div class="err-hint">${esc(SYNC_ERRORS[failed.spotify_sync_error] || 'Erro do Spotify. Carrega em Sincronizar para repetir.')}</div>`
      : '';
    const who = g.requests
      .map(r => `<span class="who-name">${esc(r.requester)}</span> <span class="when">${esc(r.time)}</span>`)
      .join('<span class="sep">·</span>');
    const badge = n > 1
      ? `<span class="count-badge" role="img" aria-label="Pedida ${n} vezes">${n}<small>pedidos</small></span>`
      : '';
    return `
      <li class="request">
        <div class="request-main">
          ${badge}
          <div class="request-info">
            <div class="request-title">${esc(g.track?.name)}</div>
            <div class="request-sub">${esc(g.track?.artist)}</div>
            <div class="who">${who}</div>
            <div class="chips">
              <span class="chip ${g.pending ? 'pending' : 'played'}">${g.pending ? 'Por tocar' : 'Tocada'}</span>
              <span class="chip ${sync.cls}">${sync.label}</span>
            </div>
            ${hint}
          </div>
        </div>
        <div class="request-actions">
          ${g.pending ? `<button class="btn btn-primary" type="button" data-play-track="${esc(g.id)}">Tocou</button>` : ''}
          <button class="btn btn-danger" type="button" data-remove-track="${esc(g.id)}" data-name="${esc(g.track?.name)}" data-count="${n}">Remover</button>
        </div>
      </li>`;
  }

  $('requests').addEventListener('click', e => {
    const play = e.target.closest('[data-play-track]');
    const remove = e.target.closest('[data-remove-track]');
    if (play) mutate(`/api/requests?track=${encodeURIComponent(play.dataset.playTrack)}`, 'PATCH', { played: true }, 'Música marcada como tocada.');
    else if (remove) removeTrack(remove.dataset.removeTrack, remove.dataset.name, Number(remove.dataset.count));
  });

  async function mutate(url, method, body, message = 'Lista atualizada.') {
    try {
      await api(url, { method, body: body ? JSON.stringify(body) : undefined });
      toast(message);
      await loadRequests();
    } catch (e) {
      if (e.status === 401) {
        toast('A sessão expirou. Entra novamente.', 'error');
        show('login');
      } else {
        toast('Não foi possível atualizar o pedido. Tenta novamente.', 'error');
      }
    }
  }

  async function removeTrack(trackId, name, n) {
    const msg = n > 1
      ? `Remover os ${n} pedidos de "${name}"? A música continua na playlist Spotify.`
      : `Remover o pedido de "${name}"? A música continua na playlist Spotify.`;
    if (!confirm(msg)) return;
    await mutate(`/api/requests?track=${encodeURIComponent(trackId)}`, 'DELETE', undefined, 'Pedidos removidos da lista.');
  }

  $('filters').addEventListener('click', e => {
    const btn = e.target.closest('[data-filter]');
    if (!btn) return;
    state.filter = btn.dataset.filter;
    [...$('filters').children].forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    renderRequests();
  });

  $('sort').addEventListener('click', e => {
    const btn = e.target.closest('[data-sort]');
    if (!btn) return;
    state.sort = btn.dataset.sort;
    [...$('sort').children].forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    renderRequests();
  });

  $('clear').addEventListener('click', async () => {
    if (confirm('Limpar todos os pedidos? As músicas continuam na playlist Spotify.')) {
      await mutate('/api/requests?id=all', 'DELETE');
    }
  });

  $('refresh').addEventListener('click', loadRequests);

  $('sync').addEventListener('click', async () => {
    const btn = $('sync');
    btn.disabled = true;
    btn.textContent = 'A sincronizar…';
    try {
      const d = await api('/api/sync', { method: 'POST', body: '{}' });
      toast(`Sincronização concluída: ${d.synced} com sucesso, ${d.failed} com falha.`, d.failed ? 'error' : 'ok');
      await loadRequests();
    } catch (e) {
      toast(e.status === 401
        ? 'A sessão expirou. Entra novamente.'
        : 'Falha na sincronização. Verifica a ligação Spotify.', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sincronizar';
    }
  });

  async function spotifyStatus() {
    const box = $('spotify-status');
    try {
      const s = await api('/api/spotify-auth?action=status');
      box.className = 'spotify ' + (s.connected ? 'ok' : 'bad');
      box.innerHTML = s.connected
        ? `<span>Spotify ligado.</span><a href="${esc(s.playlistUrl)}" target="_blank" rel="noopener">Abrir playlist</a><a href="/api/spotify-auth?action=login">Ligar outra vez</a>`
        : `<span>Spotify ainda não está ligado.</span><a href="/api/spotify-auth?action=login">Autorizar Spotify</a>`;
    } catch {
      box.className = 'spotify bad';
      box.innerHTML = `<span>Não foi possível verificar o Spotify.</span><a href="/api/spotify-auth?action=login">Tentar ligar</a>`;
    }
  }

  /* ---------- login ---------- */
  $('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('password');
    $('login-error').textContent = '';
    try {
      await api('/api/admin-login', { method: 'POST', body: JSON.stringify({ password: pw.value }) });
      pw.value = '';
      show('admin');
    } catch (err) {
      $('login-error').textContent = err.status === 401
        ? 'Palavra-passe incorreta.'
        : err.status === 503
          ? 'O servidor ainda não está configurado.'
          : 'Não foi possível iniciar sessão. Tenta outra vez.';
      pw.select();
    }
  });

  $('open-login').addEventListener('click', () => show('login'));
  $('back-guest').addEventListener('click', () => show('guest'));
  $('to-guest').addEventListener('click', () => show('guest'));
  $('logout').addEventListener('click', async () => {
    await api('/api/admin-logout', { method: 'POST' }).catch(() => {});
    show('guest');
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !$('admin').classList.contains('hidden')) loadRequests();
  });

  /* ---------- arranque ---------- */
  const params = new URLSearchParams(location.search);
  if (params.get('spotify') === 'connected') {
    history.replaceState(null, '', '/#dj');
    show('admin');
    toast('Spotify autorizado com sucesso.');
  } else if (location.hash === '#dj') {
    show('admin');
  } else {
    show('guest');
  }
})();
</script>
</body>
</html>
